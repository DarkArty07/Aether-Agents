          sed -i 's/^          //' "$expected"
          sort -o "$expected" "$expected"
          git ls-files | grep -v '^specs/' | sort >"$actual"
          diff -u "$expected" "$actual"
          test -n "$(git ls-files 'specs/**')"
          git ls-files -s specs >"$spec_manifest"
          python3 - "$spec_manifest" <<'PY'
          import re
          import sys
          from pathlib import Path, PurePosixPath

          manifest = Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          assert manifest, 'spec manifest must not be empty'
          for row in manifest:
              metadata, name = row.split('\t', 1)
              mode, _object_id, stage = metadata.split()
              path = PurePosixPath(name)
              if mode != '100644' or stage != '0':
                  raise SystemExit(f'unsafe spec mode/stage: {name}')
              if (
                  path.is_absolute()
                  or not path.parts
                  or path.parts[0] != 'specs'
                  or any(part in {'', '.', '..'} for part in path.parts)
              ):
                  raise SystemExit(f'unsafe spec path: {name}')
              suffix = path.suffix.lower()
              # Spec documents stay limited to portable .md/.json. A stage's own
              # executable diagnostics/fixtures are admitted only under that stage's
              # ``fixtures/`` directory, because a finalized Objective Contract names
              # those fixtures as canonical verification inputs (for example
              # ``specs/006-tools-memory-stability/fixtures/binding_privacy_probe.py``).
              # Every other check below (mode, path safety, NUL bytes, UTF-8, secret
              # scan) still applies to those files.
              if suffix not in {'.json', '.md'} and not (
                  suffix == '.py' and 'fixtures' in path.parts
              ):
                  raise SystemExit(f'unsupported spec extension: {name}')
              data = Path(name).read_bytes()
              if b'\0' in data:
                  raise SystemExit(f'binary spec payload: {name}')
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError as error:
                  raise SystemExit(f'non-UTF-8 spec payload: {name}') from error
              if re.search(
                  r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|'
                  r'\bghp_[A-Za-z0-9]{20,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}\b',
                  text,
              ):
                  raise SystemExit(f'secret-like spec payload: {name}')
          PY
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.dev[0-9]+)?$' VERSION
          ! git ls-files | grep -Eq '^(schemas|home/(profiles|skills|plugins|prompts))/'
          ! git grep -n -i -E 'daedalus|hefesto|ictinus|daimon|aether_mcp|olympus|acpmanager|harmonia|honcho|talk_to|orca-status' -- ':(exclude).github/workflows/policy.yml'

      - name: Validate reproducible policy hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_policy_hooks.py' -v
          python3 -m unittest discover -s tests -p 'test_aether_tui_launcher.py' -v
          python3 -m py_compile \
            policy/hooks/aether_pre_tool_policy.py \
            scripts/aether_tui.py \
            scripts/sync_policy_hooks.py \
            tests/test_aether_tui_launcher.py \
            tests/test_policy_hooks.py \
            tests/test_same_card_phase_predicates.py
          test "$(git ls-files -s policy/hooks/aether_pre_tool_policy.py | awk '{print $1}')" = 100755
          test "$(git ls-files -s scripts/aether_tui.py | awk '{print $1}')" = 100755
          test "$(git ls-files -s scripts/sync_policy_hooks.py | awk '{print $1}')" = 100755
          test "$(git ls-files -s tests/test_aether_tui_launcher.py | awk '{print $1}')" = 100644
          test "$(git ls-files -s tests/test_policy_hooks.py | awk '{print $1}')" = 100644

      - name: Validate accepted R0 design baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f DESIGN.md
          test -f ROADMAP.md
          test -f specs/r0-design-governance/spec.md
          test -f specs/r0-design-governance/research.md
          test -f specs/r0-design-governance/checklists/requirements.md
          grep -Eq '^\*\*Stage status\*\*: done' specs/r0-design-governance/spec.md
          grep -Eq '^\*\*Depends on\*\*:' specs/r0-design-governance/spec.md
          grep -Eq '^\*\*May affect\*\*:' specs/r0-design-governance/spec.md
          ! grep -Fq -- '- [ ]' specs/r0-design-governance/checklists/requirements.md
          ! grep -Eq 'BORRADOR|REABIERTA|REQUIERE REVISIÓN|SUPERSEDIDA|DESCARTADA|\bPENDIENTE\b|`B0`|`B1`|`B2`' ROADMAP.md
          test "$(git ls-files -s DESIGN.md | awk '{print $1}')" = 100644
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          spec = Path('specs/r0-design-governance/spec.md').read_text()
          research = Path('specs/r0-design-governance/research.md').read_text()
          roadmap = Path('ROADMAP.md').read_text()

          fr = re.findall(r'^- \*\*FR-(\d{3})\*\*:', spec, re.M)
          sc = re.findall(r'^- \*\*SC-(\d{3})\*\*:', spec, re.M)
          decisions = re.findall(r'^## R0-D(\d{2}) —', research, re.M)
          assert fr == [f'{i:03d}' for i in range(1, len(fr) + 1)]
          assert sc == [f'{i:03d}' for i in range(1, len(sc) + 1)]
          assert decisions == [f'{i:02d}' for i in range(1, len(decisions) + 1)]
          assert len(re.findall(r'^\| R\d+ \|', roadmap, re.M)) == 14

          md_files = [
              Path(p)
              for p in subprocess.check_output(
                  ['git', 'ls-files', '*.md'], text=True
              ).splitlines()
              if p
          ]
          assert md_files, 'tracked markdown manifest must not be empty'
          assert '001-r0-design-governance' not in '\n'.join(
              p.read_text(errors='ignore') for p in md_files
          )

          for path in md_files:
              text = path.read_text()
              assert text.count('```') % 2 == 0, f'unbalanced fence: {path}'
              for target in re.findall(r'(?<!!)\[[^]]+\]\(([^)]+)\)', text):
                  target = target.split('#', 1)[0]
                  if not target or target.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  resolved = (path.parent / target).resolve()
                  assert resolved.exists(), f'broken link in {path}: {target}'
          PY

  observation-qualification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.3
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --python "${{ matrix.python-version }}"
      - name: Reject centralized Hermes baseline drift
        run: uv run --frozen python scripts/check_hermes_baseline_drift.py --json
      - name: Validate as-built documentation registry and reference
        run: uv run --frozen python scripts/check_documentation.py
      - name: Recreate and verify exact public Hermes baseline
        run: >-
          uv run --frozen python scripts/qualify_observation.py checkout
          --path "${RUNNER_TEMP}/hermes-exact" --json
      - name: Execute observation suite and real PluginContext harness
        shell: bash
        env:
          AETHER_RUN_DEEP_QUALIFICATION: "0"
        run: |
          set -euo pipefail
          python_path="$(uv run --frozen python -c 'import sys; print(sys.executable)')"
          env -u HERMES_DELEGATED_CHILD_CONTEXT \
            uv run --frozen python scripts/qualify_observation.py test \
              --checkout "${RUNNER_TEMP}/hermes-exact" \
              --python "$python_path" \
              --output "${RUNNER_TEMP}/observation-tests-python-${{ matrix.python-version }}.json" \
              --json
      - name: Run exact-Hermes test bootstrap
        env:
          AETHER_EXACT_HERMES_CHECKOUT: "${{ runner.temp }}/hermes-exact"
        run: >-
          uv run --frozen python scripts/run_tests.py
          -- tests/test_hermes_baseline.py -q
      - name: Provide isolated Graphify Python baseline
        id: graphify-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install hash-locked disposable Graphify component
        shell: bash
        run: |
          set -euo pipefail
          component="${RUNNER_TEMP}/graphify-component"
          uv venv --python "${{ steps.graphify-python.outputs.python-path }}" --no-python-downloads "$component"
          uv pip install --python "$component/bin/python" --require-hashes \
            --index-url https://pypi.org/simple \
            -r src/aether_agents/resources/graphify/requirements.txt
          # Test instrumentation belongs only in the disposable component environment.
          pytest_version="$(uv run --frozen python -c 'import importlib.metadata; print(importlib.metadata.version("pytest"))')"
          coverage_version="$(uv run --frozen python -c 'import importlib.metadata; print(importlib.metadata.version("coverage"))')"
          uv pip install --python "$component/bin/python" \
            "pytest==$pytest_version" "coverage==$coverage_version"
      - name: Enforce integrated coverage floor
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="${RUNNER_TEMP}/hermes-exact"
          export COVERAGE_FILE="${RUNNER_TEMP}/.coverage"
          export AETHER_GRAPHIFY_PYTHON="${RUNNER_TEMP}/graphify-component/bin/python"
          export AETHER_TEST_COMPONENT_INSTALL=1
          uv run --frozen coverage run -m pytest -q --ignore=tests/test_observation_performance.py
          # The production subprocess strips instrumentation; measure its native
          # functions in the isolated engine, never install Graphify into Hermes.
          "$AETHER_GRAPHIFY_PYTHON" -m coverage run --append -m pytest -q tests/test_graphify_worker_native.py
          uv run --frozen coverage report --format=total
      - name: Retain exact-Hermes test qualification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observation-tests-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/observation-tests-python-${{ matrix.python-version }}.json
          if-no-files-found: error
      - name: Execute 10k/100k and real-callback performance evidence
        if: matrix['python-version'] == '3.11'
        run: |
          env -u HERMES_DELEGATED_CHILD_CONTEXT \
            PYTHONPATH="${RUNNER_TEMP}/hermes-exact" \
            uv run --frozen python scripts/qualify_observation.py benchmark \
              --checkout "${RUNNER_TEMP}/hermes-exact" \
              --output "${RUNNER_TEMP}/observation-benchmark-python-3.11.json" \
              --json
      - name: Contrast stable report claims with retained qualification evidence
        if: matrix['python-version'] == '3.11'
        run: |
          uv run --frozen python scripts/qualify_observation.py contrast-validation \
            --report specs/002-aether-contract-observation/evidence/implementation-validation.md \
            --result "tests=${RUNNER_TEMP}/observation-tests-python-3.11.json" \
            --result "benchmark=${RUNNER_TEMP}/observation-benchmark-python-3.11.json" \
            --json
      - name: Retain named 100k benchmark artifact
        if: matrix['python-version'] == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observation-benchmark-python-3.11
          path: ${{ runner.temp }}/observation-benchmark-python-3.11.json
          if-no-files-found: error
      - name: Static, format and bytecode gates
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff-tree --check --root --no-commit-id -r "$GITHUB_SHA"
          fi
          uv run --frozen python -m compileall -q src tests scripts/check_documentation.py scripts/qualify_knowledge_expansion.py scripts/qualify_observation.py scripts/qualify_telegram_monitor.py scripts/telegram_monitor_lab.py scripts/check_hermes_baseline_drift.py scripts/check_public_artifacts.py scripts/run_tests.py scripts/validate_hermes_patch_reconciliation.py tests/test_documentation.py
          uv run --frozen mypy src/aether_agents
          uv run --frozen ruff check src tests scripts/check_documentation.py scripts/qualify_knowledge_expansion.py scripts/qualify_observation.py scripts/qualify_telegram_monitor.py scripts/telegram_monitor_lab.py scripts/check_hermes_baseline_drift.py scripts/check_public_artifacts.py scripts/run_tests.py scripts/validate_hermes_patch_reconciliation.py
          uv run --frozen ruff format --check src tests scripts/check_documentation.py scripts/qualify_knowledge_expansion.py scripts/qualify_observation.py scripts/qualify_telegram_monitor.py scripts/telegram_monitor_lab.py scripts/check_hermes_baseline_drift.py scripts/check_public_artifacts.py scripts/run_tests.py scripts/validate_hermes_patch_reconciliation.py
      - name: Build wheel and source distribution
        run: uv build --out-dir "${RUNNER_TEMP}/aether-dist"
      - name: Reject operator-specific paths in public artifacts
        run: |
          set -euo pipefail
          artifacts=("${RUNNER_TEMP}/aether-dist/"*.whl "${RUNNER_TEMP}/aether-dist/"*.tar.gz)
          test "${#artifacts[@]}" -eq 2
          uv run --frozen python scripts/check_public_artifacts.py \
            --root . \
            --artifact "${artifacts[0]}" \
            --artifact "${artifacts[1]}"

  pull-request-target:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require main as the pull-request target
        run: test "${{ github.base_ref }}" = main
