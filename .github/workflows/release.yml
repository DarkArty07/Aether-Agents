name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated SemVer tag to reconcile
        required: true
        type: string

permissions:
  contents: write

env:
  # Maintained-fork runtime source identity for this release line (Shared decision 4).
  # The release integration sets FORK_COMMIT to the accepted `aether-main` revision before
  # the RC tag is pushed; `scripts/release_bundle.py` independently resolves that exact
  # commit from this repository and refuses a foreign repository, a wrong revision or a
  # dirty source. It never derives the identity from a branch tip, the working directory or
  # recency, so an unset/incorrect pin fails closed instead of publishing wrong bytes.
  #
  # Fork pin originated in the `@v3` recovery reconciliation
  # (`oc_742f9f4797494bf9@v3`); current objective authority is `@v4`
  # (`oc_742f9f4797494bf9@v4`), which retains the same accepted merge of reviewed `#450`
  # and `#461` into the maintained fork's `aether-main` (fork PR #15 merge
  # `aed6591a69f453a1867b73628603e7b53ba40ffc`, tree
  # `2258311f9aa52c58fda9bdbd03183ba50ac85df0`). The earlier rc.2 pin
  # `7a4fdcd083409c31c09cfa3bfa345354e8576a7e` (fork PR #14 / `#450` only) and the rc.1 pin
  # `9031bae0e8b0ab40c4fd7ba50c644972ff512611` remain historical evidence and are superseded,
  # not rewritten.
  FORK_REPOSITORY: https://github.com/DarkArty07/aether-hermes
  FORK_COMMIT: "aed6591a69f453a1867b73628603e7b53ba40ffc"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            release_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            release_prerelease=false
          elif [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.([1-9][0-9]*)$ ]]; then
            release_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}rc${BASH_REMATCH[4]}"
            release_prerelease=true
          else
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          [[ "$(<VERSION)" == "$release_version" ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == "tag" ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$(git rev-parse refs/remotes/origin/main)" ]]
          {
            printf 'version=%s\n' "$release_version"
            printf 'prerelease=%s\n' "$release_prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.3
      - name: Install locked release toolchain
        run: uv sync --frozen
      - name: Build and qualify the release bundle
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          RELEASE_BUNDLE_DIR: ${{ runner.temp }}/release-bundle
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git checkout --quiet --detach "$release_commit"
          test "$(git rev-parse HEAD)" = "$release_commit"
          uv run --frozen python scripts/release_bundle.py build \
            --aether-checkout . \
            --aether-commit "$release_commit" \
            --fork-repository "$FORK_REPOSITORY" \
            --fork-commit "$FORK_COMMIT" \
            --tag "$RELEASE_TAG" \
            --expect-package-version "$RELEASE_VERSION" \
            --work "${RUNNER_TEMP}/release-bundle-work" \
            --out "$RELEASE_BUNDLE_DIR" \
            --json
      - name: Retain the qualified bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aether-release-bundle-${{ steps.validate.outputs.version }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
      - name: Create or reconcile GitHub Release
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.validate.outputs.prerelease }}
          RELEASE_BUNDLE_DIR: ${{ runner.temp }}/release-bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            prerelease_arg=--prerelease
          elif [[ "$RELEASE_PRERELEASE" == false ]]; then
            prerelease_arg=--prerelease=false
          else
            echo "Invalid prerelease state: $RELEASE_PRERELEASE" >&2
            exit 1
          fi
          # The attach set is the tool's own qualified member list, checksum file included:
          # a file the bundle does not list is refused rather than attached.
          bundle_dir="${RELEASE_BUNDLE_DIR:-}"
          bundle_files=()
          if [[ -n "$bundle_dir" ]]; then
            (cd "$bundle_dir" && sha256sum --check --strict SHA256SUMS)
            member_list="$(uv run --frozen python scripts/release_bundle.py members --bundle "$bundle_dir")"
            mapfile -t bundle_files <<< "$member_list"
            [[ -n "${bundle_files[0]:-}" ]]
          fi
          published_assets=""
          release_exists=false
          if published_assets="$(gh release view "$RELEASE_TAG" --json assets \
              --jq '.assets[] | "\(.name)\t\(.digest // "")"' 2>/dev/null)"; then
            release_exists=true
          fi
          if [[ "$release_exists" == true ]]; then
            # `gh release edit` accepts no file arguments, so a reconcile can never attach
            # bytes: it is only correct when the release already carries exactly the
            # qualified members. Verify names and digests, or fail closed with the reason.
            if [[ -n "$bundle_dir" ]]; then
              printf '%s\n' "$published_assets" | uv run --frozen python scripts/release_bundle.py \
                verify-published-assets --bundle "$bundle_dir" --tag "$RELEASE_TAG" --assets -
            else
              echo "No qualified bundle directory: reconciling release identity only." >&2
            fi
            gh release edit "$RELEASE_TAG" "$prerelease_arg"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "$prerelease_arg" \
              "${bundle_files[@]}"
          fi
