name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated SemVer tag to reconcile
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            release_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            release_prerelease=false
          elif [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.([1-9][0-9]*)$ ]]; then
            release_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}rc${BASH_REMATCH[4]}"
            release_prerelease=true
          else
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          [[ "$(<VERSION)" == "$release_version" ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == "tag" ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$(git rev-parse refs/remotes/origin/main)" ]]
          {
            printf 'version=%s\n' "$release_version"
            printf 'prerelease=%s\n' "$release_prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Create or reconcile GitHub Release
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            prerelease_arg=--prerelease
          elif [[ "$RELEASE_PRERELEASE" == false ]]; then
            prerelease_arg=--prerelease=false
          else
            echo "Invalid prerelease state: $RELEASE_PRERELEASE" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "$prerelease_arg"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "$prerelease_arg"
          fi
