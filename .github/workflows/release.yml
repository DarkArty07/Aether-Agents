name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated SemVer tag to reconcile
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Fetch stable branch and tags
        run: git fetch --force --tags origin main:refs/remotes/origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate exact release boundary
        run: python scripts/check_release_governance.py release --tag "$RELEASE_TAG"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build ruff

      - name: Verify release candidate
        run: |
          ruff check src/ tests/ scripts/check_release_governance.py
          pytest tests/ -q
          python -m compileall -q src
          python -m build

      - name: Create or reconcile GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
