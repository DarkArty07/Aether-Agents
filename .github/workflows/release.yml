name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated SemVer tag to reconcile
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Fetch stable branch and tags
        run: git fetch --force --tags origin main:refs/remotes/origin/main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate exact release boundary
        run: python scripts/check_release_governance.py release --tag "$RELEASE_TAG"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pyyaml ruff

      - name: Build and verify bounded distribution
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          WHEEL="$GITHUB_WORKSPACE/dist/aether_mcp-0.23.0.dev0-py3-none-any.whl"
          test -f "$WHEEL"
          python -m pip install --force-reinstall "$WHEEL"
          cd /tmp
          python - <<'PY'
          import aether_mcp

          assert aether_mcp.__version__ == '0.23.0.dev0'
          assert aether_mcp.PROTOCOL_ID == 'aether.mcp/v1alpha2'
          print('release_build=PASS package=aether-mcp version=0.23.0.dev0')
          PY
          cd "$GITHUB_WORKSPACE"

      - name: Verify release candidate
        run: |
          ruff check tests/ scripts/check_release_governance.py
          pytest tests/ -q
          python -m compileall -q tests scripts/check_release_governance.py
          bash -n scripts/setup.sh scripts/update.sh scripts/start-gateway.sh
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          root = Path('.')
          templates = [root / 'home/config.yaml.template', *sorted((root / 'home/profiles').glob('*/config.yaml.template'))]
          assert len(templates) == 4
          for path in templates:
              yaml.safe_load(path.read_text())
          source_files = set(subprocess.check_output(['git', 'ls-files', 'src'], text=True).splitlines())
          assert source_files == {
              'src/aether_mcp/__init__.py',
              'src/aether_mcp/__main__.py',
              'src/aether_mcp/adapter.py',
              'src/aether_mcp/admission.py',
              'src/aether_mcp/catalog.py',
              'src/aether_mcp/content_store.py',
              'src/aether_mcp/coordination.py',
              'src/aether_mcp/data/orca/1.4.167/catalog.json',
              'src/aether_mcp/foundation.py',
              'src/aether_mcp/guidance.py',
              'src/aether_mcp/journal.py',
              'src/aether_mcp/lifecycle.py',
              'src/aether_mcp/manifest.py',
              'src/aether_mcp/orca_provider.py',
              'src/aether_mcp/protocol.py',
              'src/aether_mcp/runtime.py',
              'src/aether_mcp/server.py',
              'src/aether_mcp/trace_store.py',
          }
          assert not list((root / 'home/profiles').glob('*/plugins/aether'))
          print('release_assets=PASS')
          PY

      - name: Create or reconcile GitHub Release
        run: |
          VERSION="${RELEASE_TAG#v}"
          NOTES="docs/releases/v${VERSION}/RELEASE_NOTES.md"
          TITLE="$(head -n 1 "$NOTES" | sed 's/^# //')"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --notes-file "$NOTES" \
              --title "$TITLE"
          fi
