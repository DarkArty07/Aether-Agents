name: Publish Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated SemVer tag to reconcile
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(cat VERSION)" == "${RELEASE_TAG#v}" ]]
          git cat-file -e "$RELEASE_TAG^{tag}"
          git fetch origin main
          [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$(git rev-parse origin/main)" ]]
      - name: Create or reconcile GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --generate-notes
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
