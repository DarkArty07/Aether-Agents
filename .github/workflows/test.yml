name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest ruff pyyaml

      - name: Lint with ruff
        run: |
          ruff check tests/ scripts/check_release_governance.py

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  product-assets:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Validate product assets
        run: |
          bash -n scripts/setup.sh scripts/update.sh scripts/start-gateway.sh
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path('.')
          templates = [root / 'home/config.yaml.template', *sorted((root / 'home/profiles').glob('*/config.yaml.template'))]
          assert len(templates) == 7
          for path in templates:
              yaml.safe_load(path.read_text())
          assert not (root / 'src').exists()
          assert not list((root / 'home/profiles').glob('*/plugins/aether'))
          print('product_assets=PASS')
          PY
          python scripts/check_release_governance.py policy
