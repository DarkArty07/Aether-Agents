# Search/extraction credentials are provisioned locally; never ship key values.
web:
  backend: exa
  search_backend: exa
  extract_backend: exa
  use_gateway: false
plugins:
  enabled:
    - aether-contract-observer
    - aether-objective-contracts
    - aether-project-knowledge
    - aether-telegram-monitor
  entries:
    aether-contract-observer:
      settings:
        curated_tool: true
    aether-objective-contracts:
      settings:
        author_profile: morfeo
    aether-project-knowledge:
      settings:
        enabled: false
    aether-telegram-monitor:
      settings:
        enabled: true
        language: Spanish
