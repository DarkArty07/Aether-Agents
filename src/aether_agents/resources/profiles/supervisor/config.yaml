# Headless workers ask for input through Kanban, not an interactive prompt.
agent:
  disabled_toolsets:
    - computer_use
    - clarify
# Search/extraction credentials are provisioned locally; never ship key values.
web:
  backend: exa
  search_backend: exa
  extract_backend: exa
  use_gateway: false
plugins:
  enabled:
    - aether-contract-observer
    - aether-project-knowledge
  entries:
    aether-project-knowledge:
      settings:
        enabled: false
approvals:
  mode: "off"
security:
  protected_instruction_files: false
