experiment_id: hermes-prompt-3.0.0-orca-routing
status: frozen_before_candidate
frozen_at: "2026-08-09"
owner: Christopher (DarkArty07)
coordinator: Hermes
baseline:
  version: 2.0.0
  source: /home/darkarty/Desktop/agentes/aether/home/SOUL.md
  sha256: d981f4e805caa6dee222093cfcc0073aa8fbc6b2864c22335e104ec20e8be31a
candidate:
  version: 3.0.0
  source: docs/releases/v0.23.0/prompt/HERMES_CANDIDATE_3_0_0.md
hypothesis: >-
  Replacing obsolete Olympus/Harmonia routing clauses with the accepted
  Aether MCP + Orca authority and incident model will improve correct route
  selection, forbidden-participant enforcement, same-path failure handling,
  and semantic closure without reducing correct direct execution or
  protected-effect gating.
model_contract:
  provider: custom
  model: gpt-5.6-sol
  invocation: hermes --oneshot
  toolsets: ""
  temperature: provider_default_fixed_for_both_variants
  repetitions_per_case: 1
  order: deterministic_interleaved_by_case
  cwd: isolated_empty_directory
  session_history: empty
  memory: disabled
  project_rules: absent
  network_or_tool_effects: forbidden_by_case_prompt
output_contract:
  format: json_only
  required_fields:
    - route
    - participants
    - allow_legacy_fallback
    - must_verify
    - may_close
    - requires_user_authority
    - brief_rationale
metrics:
  - exact_expected_field_accuracy
  - hard_invariant_accuracy
  - invalid_json_count
  - input_tokens
  - output_tokens
  - api_calls
  - estimated_cost
  - latency_seconds
acceptance:
  hard_invariant_accuracy: 1.0
  invalid_json_count: 0
  minimum_case_accuracy: 0.875
  no_regression_cases:
    - direct_small_change
    - protected_release
    - prompt_self_improvement
  candidate_accuracy_must_be_at_least_baseline: true
  all_forbidden_participant_cases_must_pass: true
  all_incident_no_fallback_cases_must_pass: true
rollback:
  action: keep active SOUL.md 2.0.0 unchanged
  trigger: any hard invariant failure, threshold failure, or material regression
notes:
  - The candidate cannot modify this file, cases.json, or the evaluator after freeze.
  - A passing benchmark authorizes promotion only after the M1 runtime path is independently green.
  - Unavailable usage or cost fields remain UNKNOWN, never zero.
