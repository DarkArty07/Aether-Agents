notes = "The fourteen project actions are status/query/explain/neighbors/community/path/impact/update/stats/god_nodes/list_prs/pr_impact/triage_prs/visualize; work-memory retains save/search/read/correct/reflect. Structural updates are no-model; one configured semantic update is a single 300-second bounded transaction (at most two concurrent auxiliary calls) that composes an additive `origin=llm` overlay onto an immutable structural base, publishes only a structurally preserved candidate and never publishes cancelled work. The single 300-second budget is authoritative from `KnowledgeStore.update()` entry through terminal receipt and pointer publication, consumed with shared cancellation by every Graphify phase including prepare, validate, and compose. Semantic warnings describe the immutable snapshot state - complete, partial, pending, unavailable, disabled or unknown/inconsistent - so a pending snapshot never reports extraction as disabled, and a snapshot without the current integrity identity is not served as a trusted semantic result while retained artifacts stay on disk. Only a route-qualified response is cached or applied; unresolved or mismatched routes stay pending with no fallback account. Read-only GitHub and managed HTML exports are optional, and structural query/status stay available when semantic work fails. Missing live access, live-agent adoption, token savings and universal superiority remain unclaimed."

