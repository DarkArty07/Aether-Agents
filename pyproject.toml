[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aether-agents"
dynamic = ["version"]
description = "Aether Agents — multi-agent software-engineering method layered on Hermes Agent and Spec Kit."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Christopher" }]
keywords = ["aether", "agents", "hermes", "spec-kit", "observation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "jsonschema==4.26.0",
]

[project.scripts]
aether = "aether_agents.cli:main"

# Aether plugin allow-list: exact entry points, each targeting a module exposing register(ctx).
[project.entry-points."hermes_agent.plugins"]
aether-contract-observer = "aether_agents.observation.capture.hermes_plugin"
aether-objective-contracts = "aether_agents.objective_contracts.hermes_plugin"

[project.urls]
Homepage = "https://github.com/DarkArty07/aether-agents"
Issues = "https://github.com/DarkArty07/aether-agents/issues"

# Single source of truth for the product version (OBS-FR-071: observation shares it).
[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[^\\s]+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_agents"]

# OBS-FR-075: package the exact normative bytes without maintaining a second
# source copy. The laboratory bytes are mapped into package resources by the
# source-distribution force-include below.
[tool.hatch.build.targets.wheel.force-include]
"specs/002-aether-contract-observation/contracts/observation-event.schema.json" = "aether_agents/resources/schemas/observation-event.schema.json"
"specs/002-aether-contract-observation/contracts/observation-summary.schema.json" = "aether_agents/resources/schemas/observation-summary.schema.json"
"specs/002-aether-contract-observation/contracts/observation-brief.schema.json" = "aether_agents/resources/schemas/observation-brief.schema.json"
"specs/002-aether-contract-observation/contracts/observation-segment-manifest.schema.json" = "aether_agents/resources/schemas/observation-segment-manifest.schema.json"
"specs/001-aether-v1-productization/contracts/release-lock.schema.json" = "aether_agents/resources/schemas/release-lock.schema.json"
"specs/001-aether-v1-productization/contracts/project.schema.json" = "aether_agents/resources/schemas/project.schema.json"

[tool.hatch.build.targets.sdist]
include = [
  "/src/aether_agents",
  "/src/aether_agents/resources/lab/**",
  "/lab",
  "/scripts/e2e",
  "/specs/002-aether-contract-observation/contracts",
  "/specs/001-aether-v1-productization/contracts/release-lock.schema.json",
  "/specs/001-aether-v1-productization/contracts/project.schema.json",
  "/tests",
  "/VERSION",
  "/README.md",
  "/LICENSE",
]

[tool.hatch.build.targets.sdist.force-include]
"lab" = "src/aether_agents/resources/lab"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: disposable package/runtime integration test",
  "hermes_exact: requires the release-locked public Hermes checkout",
]

[dependency-groups]
dev = [
  # Reproducible build backend; build/dev only, never a wheel runtime dependency.
  "hatchling==1.27.0",
  "pytest>=8.3",
  # Required only by the release-locked Hermes checkout used in adapter tests.
  "PyYAML>=6.0",
  # Static gate only; never installed into the manager/runtime wheel.
  "ruff>=0.12.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
