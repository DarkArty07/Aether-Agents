[project]
name = "aether-agents"
version = "0.22.0"
description = "Aether Agents product contracts, continuity, evidence, and self-improvement."
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Christopher (DarkArty07)" },
]
readme = "README.md"
keywords = ["multi-agent", "ai", "continuity", "governance", "daimons", "aether"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Intended Audience :: Developers",
]
dependencies = [
    "aiosqlite>=0.20.0,<1.0.0",
    "pyyaml>=6.0",
]
[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "hermes-agent>=0.19.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/DarkArty07/Aether-Agents"
Documentation = "https://github.com/DarkArty07/Aether-Agents#readme"
Repository = "https://github.com/DarkArty07/Aether-Agents"
Changelog = "https://github.com/DarkArty07/Aether-Agents/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
